# A validação (@Valid) acontece nos controllers. Desligada na gravação do JPA porque,
# no merge de entidade nova, o Hibernate persiste a cópia com as coleções vazias e @NotEmpty falharia.
spring.jpa.properties.javax.persistence.validation.mode=none
